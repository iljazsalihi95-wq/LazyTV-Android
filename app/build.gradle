plugins {
    id 'com.android.application'
}

def activationBaseUrl = (project.findProperty("ACTIVATION_BASE_URL") ?: System.getenv("ACTIVATION_BASE_URL") ?: "").toString()
def escBuildConfig = { String v -> '"' + v.replace('\\','\\\\').replace('"','\\"') + '"' }
def signingStoreFile = System.getenv("LAZYTV_SIGNING_STORE_FILE")
def signingStorePassword = System.getenv("LAZYTV_SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("LAZYTV_SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("LAZYTV_SIGNING_KEY_PASSWORD")
def hasStableSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    buildFeatures { buildConfig true }
    namespace 'de.lazytv.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'de.lazytv.pro'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'ACTIVATION_BASE_URL', escBuildConfig(activationBaseUrl)
        buildConfigField 'boolean', 'DEV_ACTIVATION_BYPASS', 'false'
    }

    signingConfigs {
        if (hasStableSigning) {
            lazytvStable {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'DEV_ACTIVATION_BYPASS', 'true'
            if (hasStableSigning) signingConfig signingConfigs.lazytvStable
        }
        release {
            buildConfigField 'boolean', 'DEV_ACTIVATION_BYPASS', 'false'
            if (hasStableSigning) signingConfig signingConfigs.lazytvStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}


def officialLogoB64 = file("src/main/assets/lazytv_official_logo.png.b64")
def generatedLogoDir = file("src/main/res/drawable-nodpi")
def generatedLogo = file("src/main/res/drawable-nodpi/lazytv_official_logo.png")
tasks.register("prepareOfficialLazyTvLogo") {
    inputs.file(officialLogoB64)
    outputs.file(generatedLogo)
    doLast {
        generatedLogoDir.mkdirs()
        generatedLogo.bytes = officialLogoB64.text.trim().decodeBase64()
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("prepareOfficialLazyTvLogo") }
