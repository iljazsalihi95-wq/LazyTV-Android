name: LazyTV Fire TV signed update
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Use the runner's supported command-line tools, not the removed `tools` package.
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.LAZYTV_SIGNING_KEYSTORE_B64 || secrets.LAZYTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Stable signing keystore missing. Refusing to produce a non-updatable APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lazytv-stable.jks"
      - name: Build signed release APK
        env:
          LAZYTV_SIGNING_STORE_FILE: ${{ runner.temp }}/lazytv-stable.jks
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
          ACTIVATION_BASE_URL: ${{ secrets.ACTIVATION_BASE_URL }}
        run: |
          test -n "$ACTIVATION_BASE_URL" || { echo "::error::ACTIVATION_BASE_URL is required for an activated release"; exit 1; }
          test -n "$LAZYTV_SIGNING_STORE_PASSWORD"
          test -n "$LAZYTV_SIGNING_KEY_ALIAS"
          test -n "$LAZYTV_SIGNING_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Verify release signature and activation policy
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          grep -q 'DEV_ACTIVATION_BYPASS = false' app/build/generated/source/buildConfig/release/de/lazytv/pro/BuildConfig.java
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LazyTV-PRO-FireTV-update-622
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
