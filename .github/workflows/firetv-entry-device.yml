name: Android TV native entry regression
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/firetv-entry-device.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [25, 28, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android TV launch and DPAD tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash scripts/test_tv_entries.sh
      - name: Preserve device failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-${{ matrix.api }}-entry-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-evidence/
