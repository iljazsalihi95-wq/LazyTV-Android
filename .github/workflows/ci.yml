name: LazyTV CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paypal-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Netlify PayPal webhook
        run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install
      - name: Verify dependencies including bcryptjs
        run: npm ls && node -e "require('bcryptjs'); console.log('bcryptjs OK')"
      - name: Backend tests
        env:
          NODE_ENV: test
          SESSION_SECRET: github-actions-test-session-secret-not-production
        run: npm test
      - name: Google Sheet activation mapping tests
        run: node --test test/sheet-mapping.test.js
  android:
    needs: [backend, paypal-webhook]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check production activation/signing configuration
        env:
          ACTIVATION_BASE_URL: ${{ secrets.ACTIVATION_BASE_URL }}
          SIGNING_KEYSTORE_B64: ${{ secrets.LAZYTV_SIGNING_KEYSTORE_B64 }}
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
        run: |
          [ -n "$ACTIVATION_BASE_URL" ] && echo "ACTIVATION_BASE_URL=CONFIGURED" || echo "ACTIVATION_BASE_URL=NOT_CONFIGURED"
          [ -n "$SIGNING_KEYSTORE_B64" ] && echo "SIGNING_KEYSTORE=CONFIGURED" || echo "SIGNING_KEYSTORE=NOT_CONFIGURED"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lazytv-signing.jks"
            echo "LAZYTV_SIGNING_STORE_FILE=$RUNNER_TEMP/lazytv-signing.jks" >> "$GITHUB_ENV"
          fi
          echo "ACTIVATION_BASE_URL=$ACTIVATION_BASE_URL" >> "$GITHUB_ENV"
      - name: Diagnose euiptv port 8080 transport (no credentials)
        shell: bash
        run: |
          set +e
          echo "DNS:"
          getent ahostsv4 euiptv.live | head -5 || true
          echo "TCP_8080:"
          timeout 10 bash -c 'echo > /dev/tcp/euiptv.live/8080'
          echo "TCP_RC=$?"
          echo "TLS_8080:"
          timeout 12 openssl s_client -connect euiptv.live:8080 -servername euiptv.live -brief </dev/null 2>&1 | head -20
          echo "TLS_RC=${PIPESTATUS[0]}"
          echo "HTTP_8080_GETPHP:"
          curl -sv --connect-timeout 10 --max-time 20 -o /dev/null http://euiptv.live:8080/get.php 2>&1 | head -35
          echo "HTTP_RC=${PIPESTATUS[0]}"
          echo "HTTPS_8080_GETPHP:"
          curl -sv --connect-timeout 10 --max-time 20 -o /dev/null https://euiptv.live:8080/get.php 2>&1 | head -35
          echo "HTTPS_RC=${PIPESTATUS[0]}"
      - name: Provider session and HTTP regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        env:
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Verify debug/release activation policy
        run: |
          grep -q "DEV_ACTIVATION_BYPASS = true" app/build/generated/source/buildConfig/debug/de/lazytv/pro/BuildConfig.java
          echo "Debug development bypass is enabled."
          gradle --no-daemon generateReleaseBuildConfig
          grep -q "DEV_ACTIVATION_BYPASS = false" app/build/generated/source/buildConfig/release/de/lazytv/pro/BuildConfig.java
          echo "Release activation bypass is disabled."
          if [ -z "$ACTIVATION_BASE_URL" ]; then
            echo "Production activation endpoint not configured; release activation cannot be end-to-end tested yet."
          fi
      - name: Publish verified public update when production signing is configured
        env:
          GH_TOKEN: ${{ github.token }}
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$LAZYTV_SIGNING_STORE_FILE" ] || [ -z "$LAZYTV_SIGNING_STORE_PASSWORD" ] || [ -z "$LAZYTV_SIGNING_KEY_ALIAS" ] || [ -z "$LAZYTV_SIGNING_KEY_PASSWORD" ] || [ -z "$ACTIVATION_BASE_URL" ]; then
            echo "PUBLIC_UPDATE=NOT_PUBLISHED: stable production signing/activation configuration required. Existing signing keys are never replaced."
            exit 0
          fi
          gradle --no-daemon assembleRelease
          mkdir -p public-update
          cp app/build/outputs/apk/release/app-release.apk public-update/LazyTV-PRO.apk
          python3 scripts/create_update_manifest.py public-update/LazyTV-PRO.apk public-update/update.json
          version=$(python3 -c 'import json;print(json.load(open("public-update/update.json"))["versionCode"])')
          gh release create "v$version" public-update/LazyTV-PRO.apk public-update/update.json --target "$GITHUB_SHA" --title "LazyTV PRO $version" --notes "Automated checks passed. Physical Fire TV validation required."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LazyTV-PRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
