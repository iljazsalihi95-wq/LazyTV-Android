name: LazyTV CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install
      - name: Verify dependencies including bcryptjs
        run: npm ls && node -e "require('bcryptjs'); console.log('bcryptjs OK')"
      - name: Backend tests
        env:
          NODE_ENV: test
          SESSION_SECRET: github-actions-test-session-secret-not-production
        run: npm test
      - name: Google Sheet activation mapping tests
        run: node --test test/sheet-mapping.test.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LazyTV-PRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
