name: LazyTV CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install
      - name: Verify dependencies including bcryptjs
        run: npm ls && node -e "require('bcryptjs'); console.log('bcryptjs OK')"
      - name: Backend tests
        env:
          NODE_ENV: test
          SESSION_SECRET: github-actions-test-session-secret-not-production
        run: npm test
      - name: Google Sheet activation mapping tests
        run: node --test test/sheet-mapping.test.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check production activation/signing configuration
        env:
          ACTIVATION_BASE_URL: ${{ secrets.ACTIVATION_BASE_URL }}
          SIGNING_KEYSTORE_B64: ${{ secrets.LAZYTV_SIGNING_KEYSTORE_B64 }}
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
        run: |
          [ -n "$ACTIVATION_BASE_URL" ] && echo "ACTIVATION_BASE_URL=CONFIGURED" || echo "ACTIVATION_BASE_URL=NOT_CONFIGURED"
          [ -n "$SIGNING_KEYSTORE_B64" ] && echo "SIGNING_KEYSTORE=CONFIGURED" || echo "SIGNING_KEYSTORE=NOT_CONFIGURED"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lazytv-signing.jks"
            echo "LAZYTV_SIGNING_STORE_FILE=$RUNNER_TEMP/lazytv-signing.jks" >> "$GITHUB_ENV"
          fi
          echo "ACTIVATION_BASE_URL=$ACTIVATION_BASE_URL" >> "$GITHUB_ENV"
      - name: Assemble debug APK
        env:
          LAZYTV_SIGNING_STORE_PASSWORD: ${{ secrets.LAZYTV_SIGNING_STORE_PASSWORD }}
          LAZYTV_SIGNING_KEY_ALIAS: ${{ secrets.LAZYTV_SIGNING_KEY_ALIAS }}
          LAZYTV_SIGNING_KEY_PASSWORD: ${{ secrets.LAZYTV_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Verify activation URL embedded
        run: |
          if [ -z "$ACTIVATION_BASE_URL" ]; then
            echo "Production activation endpoint is not configured in GitHub Secrets."
            exit 2
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LazyTV-PRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
