name: APK Installability Diagnosis
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apk-install-diagnosis.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: APK metadata and signature
        run: |
          echo "=== AAPT BADGING ==="
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk
          echo "=== APKSIGNER ==="
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo "=== NATIVE LIBRARIES ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep ' lib/.*\.so$' || true
          echo "=== MERGED MANIFEST ==="
          cat app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml || find app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml -print -exec cat {} \;
      - name: Create emulator
        run: |
          echo no | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager create avd -n lazytv_ci -k "system-images;android-35;google_apis;x86_64" --force
      - name: Start emulator and adb install
        run: |
          nohup /usr/local/lib/android/sdk/emulator/emulator -avd lazytv_ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
          timeout 180 bash -c 'until [ "$(/usr/local/lib/android/sdk/platform-tools/adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          /usr/local/lib/android/sdk/platform-tools/adb shell pm list packages | grep de.lazytv.pro || true
          set +e
          /usr/local/lib/android/sdk/platform-tools/adb install -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee adb-install.log
          code=${PIPESTATUS[0]}
          set -e
          cat adb-install.log
          exit $code
